# Project: protein-queries
#
# All inference goes to the UNSW ResTech Local Inference gateway (OpenAI-compatible).
# No vendor cloud API is permitted anywhere in this project:
#   BASE URL  https://inference.restech.unsw.edu.au/v1
#   AUTH      Authorization: Bearer $RESTECH_API_KEY   (never committed, never logged)
#   MODELS    qwen3.8-flash-next (default) | qwen3.8-27b | glm-5.3-flash
#   TOOLS     function calling is supported; use tool_choice:"required" to forbid
#             memory-only answers. Verify the live roster with GET /v1/models.
#
# Everything the assistant tells a user about a specific protein MUST come from a
# tool call executed in that request:
#   UniProt REST  https://rest.uniprot.org   -> search_uniprotkb, fetch_uniprot_entry, fetch_fasta
#   PDBe MCP      PDBe-MCP-Servers           -> API + Search server tools
# If a claim has no matching tool call in the transcript, it does not get said.

[project]
name = "protein-queries"
version = "0.1.0"
description = "Retrieval-grounded protein data assistant backed by the UNSW ResTech Local Inference gateway"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "biopython>=1.84",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
protein-agent = "protein_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
